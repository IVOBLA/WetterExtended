<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0}</style></head><body><div id='map'></div>
<script>
const map=L.map('map').setView([46.62,14.31],8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let layer=L.layerGroup().addTo(map);let fLayer=L.layerGroup().addTo(map);
const col={new:'green',continued:'blue',merged:'orange',split:'magenta'};
async function load(){layer.clearLayers();fLayer.clearLayers(); const objs=await (await fetch('/api/objects')).json(); const fc=await (await fetch('/api/forecast')).json();
objs.forEach(o=>{if(o.contour_geo){L.polygon(o.contour_geo,{color:col[o.lineage]||'gray',fillOpacity:0.3,weight:2}).addTo(layer);} if(o.lat&&o.lon){const r=Math.max(4,Math.sqrt(o.area||0)/8); L.circleMarker([o.lat,o.lon],{radius:r}).addTo(layer).bindPopup(`ID:${o.id}<br>lineage:${o.lineage}<br>parents:${(o.parents||[]).join(',')}<br>area:${o.area}<br>core:${o.core_ratio}<br>(10m):${o.forecast_lat_10},${o.forecast_lon_10}`);} [[10,'4,4',1],[20,'',1],[30,'',3]].forEach(([h,d,w])=>{if(o[`forecast_lat_${h}`]&&o[`forecast_lon_${h}`]) L.polyline([[o.lat,o.lon],[o[`forecast_lat_${h}`],o[`forecast_lon_${h}`]],],{color:'red',dashArray:d,weight:w}).addTo(fLayer);});});
(fc.features||[]).forEach(f=>{const c=f.geometry.coordinates;L.circleMarker([c[1][1],c[1][0]],{radius:3,color:'red'}).addTo(fLayer)});
}
load();setInterval(load,60000);
</script></body></html>
