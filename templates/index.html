<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stormtracker — Übersicht</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;

            text-align: center;
            margin: 0;

        }

        h1 {
            color: #4CAF50;
        }
