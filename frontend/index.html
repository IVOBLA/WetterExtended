<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover: Vollbild auf iPhone X+ (kein weißer Rand an Notch/Home-Bar) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- PWA / Add to Home Screen -->
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WetterExtended" />
  <title>WetterExtended</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* Basis-Reset für Vollbild-Karte */
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    /* Tap-Highlight entfernen (verhindert blaue Blitze bei Touch) */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    /* Kein Pull-to-Refresh / Bounce-Scroll */
    body {
      overscroll-behavior: none;
    }
    /* Leaflet-Karte auf Vollbild-Modus optimieren */
    .leaflet-container {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    /* Touch-Action: Pan-Zoom flüssiger machen */
    .leaflet-touch .leaflet-control-zoom a {
      width: 44px !important;
      height: 44px !important;
      line-height: 44px !important;
      font-size: 20px !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
