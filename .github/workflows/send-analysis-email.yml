name: Analyse-Mail versenden

on:
  schedule:
    - cron: '0 6 * * *'   # täglich 06:00 UTC (08:00 CEST) – nach KI-Analyse-Lauf
  workflow_dispatch:       # manueller Trigger für Tests

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: debug-export-latest

      - name: Analyse-Mail via SendGrid versenden
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, json, time, urllib.request, urllib.error
          from datetime import datetime

          # Guard A: Datei muss vorhanden sein
          if not os.path.exists("analysis_result.json"):
              print("Keine analysis_result.json vorhanden – kein Mail-Versand heute.")
              raise SystemExit(0)

          # Guard B: Datei darf nicht älter als 25h sein
          age_h = (time.time() - os.path.getmtime("analysis_result.json")) / 3600
          if age_h > 25:
              print(f"analysis_result.json ist {age_h:.1f}h alt – überspringe Mail-Versand.")
              raise SystemExit(0)

          SENDGRID_API_KEY = os.environ["SENDGRID_API_KEY"]
          FROM_EMAIL       = "claude@blatec.at"
          FROM_NAME        = "WetterExtended"
          TO_EMAIL         = "bla@uniquare.com"

          with open("analysis_result.json", encoding="utf-8") as f:
              data = json.load(f)

          datum = datetime.now().strftime("%d.%m.%Y %H:%M")

          def section(titel, farbe, bg, items):
              if not items:
                  return ""
              lis = "".join(
                  f'<li style="margin-bottom:8px">{i}</li>' for i in items
              )
              return (
                  f'<h3 style="color:{farbe};border-left:4px solid {farbe};'
                  f'padding-left:10px;margin-top:22px">'
                  f'{titel} ({len(items)})</h3>'
                  f'<ul style="background:{bg};padding:12px 12px 12px 32px;'
                  f'border-radius:4px;line-height:1.8;margin:0">{lis}</ul>'
              )

          html = (
              '<div style="font-family:Arial,sans-serif;max-width:800px;color:#333">'
              '<div style="background:#2c3e50;color:white;padding:22px;'
              'border-radius:8px 8px 0 0">'
              '<h2 style="margin:0">WetterExtended &#8211; Taegliche Analyse</h2>'
              f'<p style="margin:6px 0 0;opacity:.8;font-size:13px">{datum}</p>'
              '</div>'
              '<div style="padding:22px;border:1px solid #ddd;border-top:none">'
              + section("Fehler",         "#e74c3c", "#fff5f5",
                        data.get("fehler",        []))
              + section("Loesungen",      "#27ae60", "#f0fff0",
                        data.get("loesungen",     []))
              + section("Verbesserungen", "#3498db", "#f0f8ff",
                        data.get("verbesserungen",[]))
              + section("Code-Prompts",   "#8e44ad", "#faf0ff",
                        data.get("prompts",       []))
              + (
                  '<h3 style="color:#e67e22;border-left:4px solid #e67e22;'
                  'padding-left:10px;margin-top:22px">Zusammenfassung</h3>'
                  f'<div style="background:#fff9f0;padding:12px;border-radius:4px">'
                  f'{data.get("zusammenfassung","")}</div>'
                  if data.get("zusammenfassung") else ""
              )
              + '</div>'
              '<div style="background:#ecf0f1;padding:12px;text-align:center;'
              'border-radius:0 0 8px 8px;font-size:12px;color:#7f8c8d">'
              'Claude Code Routine &#8211; IVOBLA/WetterExtended &#8211; taeglich 08:00 CEST'
              '</div></div>'
          )

          payload = json.dumps({
              "personalizations": [{"to": [{"email": TO_EMAIL}]}],
              "from": {"email": FROM_EMAIL, "name": FROM_NAME},
              "subject": f"WetterExtended Analyse {datum}",
              "content": [{"type": "text/html", "value": html}]
          }).encode()

          req = urllib.request.Request(
              "https://api.sendgrid.com/v3/mail/send",
              data=payload,
              headers={
                  "Authorization": f"Bearer {SENDGRID_API_KEY}",
                  "Content-Type":  "application/json"
              }
          )

          try:
              urllib.request.urlopen(req)
              print(f"OK: E-Mail versendet an {TO_EMAIL}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"FEHLER: {e.code} {body}")
              raise SystemExit(1)
          PYEOF
